      const messages = [];
      let level = "warn";
      if (d.fixedTurnsLimited) {
        messages.push(`固定匝数请求 ${formatTurns(d.requestedTurns)}，当前最多可绕 ${formatTurns(d.nMax)} 匝，已按 ${formatTurns(d.turns)} 匝绘制。`);
        level = "error";
      }
      if (d.autoLimit === "max") {
        messages.push(`目标电感超出当前板框的最大绕制能力，已达到 ${formatTurns(d.nMax)} 匝上限。`);
        level = "error";
      } else if (d.autoLimit === "min") {
        messages.push("目标电感低于一匝线圈的可实现范围，已停在最小 1.00 匝。");
      } else if (d.autoLimit === "geometry") {
        messages.push(`连续解 ${formatTurns(d.geometryAdjustedFrom)} 匝净距不足，已改用可制造的 ${formatTurns(d.turns)} 匝。`);
      }
      if (messages.length) showRangeAlert(messages.join(" "), level);
      else clearRangeAlert();
    }

    function calcAndDraw() {
      clearRangeAlert();
      const capPf = parseFloat($("capPf").value);
      const freqMhz = parseFloat($("freqMhz").value);
      const shape = $("shape").value;
      const rectW = parseFloat($("outerW").value);
      const rectH = parseFloat($("outerH").value);
      const circleDia = parseFloat($("circleDia").value);
      // 圆形模式的 D 就是板框直径；隐藏的矩形 W/H 不再影响圆形结果。
      const W = shape === "circle" ? circleDia : rectW;
      const H = shape === "circle" ? circleDia : rectH;
      const w = parseFloat($("widthMm").value);
      const gap = parseFloat($("gapMm").value);
      const chamfer = parseFloat($("chamferMm").value);
      const dir = $("dir").value;
      const maxDensity = $("maxDensity").checked;
      const startSide = $("startSide").value;
      const endSide = $("endSide").value;
      const padMm = parseFloat($("padMm").value);
      const gridMm = parseFloat($("gridMm").value);
      const oz = parseFloat($("copperOz").value);
      const dualLayer = $("dualLayer").checked;

      const minimumBoardSpan = 2 * BOARD_EDGE_INSET + Math.max(w, padMm);
      if (!(capPf > 0) || !(freqMhz > 0) || !(w > 0) || !(gap > 0) || !(padMm > 0) || !(gridMm > 0) || !(W > minimumBoardSpan) || !(H > minimumBoardSpan)) {
        failCalculation("参数无效，或板框小到无法满足线/过孔边缘距板框 0.30 mm 的硬约束。", "参数超出范围");
        return;
      }

      const pitch = windingPitch(w, gap, false);
      const bottomInset = BOARD_EDGE_INSET + pitch / 2;
      const Ltarget = lnHFromLC(capPf, freqMhz);
      const circleOuterDiameter = shape === 'circle' ? circleDia - 2 * BOARD_EDGE_INSET : null;
      const bottomCircleDiameter = shape === 'circle' ? Math.max(circleOuterDiameter - pitch, w) : null;

      let nMax = dualLayer
        ? Math.min(
            maxTurns({ W, H, w, gap, padMm, dualLayer, outerInset: BOARD_EDGE_INSET, shape, outerDiameter: circleOuterDiameter }),
            maxTurns({ W, H, w, gap, padMm, dualLayer, outerInset: bottomInset, shape, outerDiameter: bottomCircleDiameter })
          )
        : maxTurns({ W, H, w, gap, padMm, dualLayer, outerInset: BOARD_EDGE_INSET, shape, outerDiameter: circleOuterDiameter });
      if (shape === "rect") {
        const seed = startPos.userSet ? startPos : defaultOuterBL(w, padMm, gridMm);
        const topOpeningMax = maxRectTurnsWithOpening({
          W, H, w, gap, padMm, chamfer, dir,
          startX: seed.x, startY: seed.y, outerInset: BOARD_EDGE_INSET, limit: nMax,
        });
        const bottomOpeningMax = dualLayer ? maxRectTurnsWithOpening({
          W, H, w, gap, padMm, chamfer, dir: dir === "cw" ? "ccw" : "cw",
          startX: seed.x, startY: seed.y, outerInset: bottomInset, limit: nMax,
        }) : nMax;
        nMax = Math.min(nMax, topOpeningMax, bottomOpeningMax);
      }
      if (nMax < 1) {
        failCalculation(`当前${shape === "circle" ? "圆形" : "矩形"}板框无法同时容纳线圈、端子和 0.30 mm 板边安全距，请增大板框或减小焊盘/线宽/间距。`, "可绕制空间不足");
        return;
      }
      const requestedTurns = parseFloat($("turnsFixed").value);
      const fixedTurnsLimited = !maxDensity && (!(requestedTurns >= MIN_TURNS) || requestedTurns > nMax + 1e-9);
      let turns = maxDensity
        ? autoTurnsForTarget({ W, H, w, gap, nMax, capPf, freqMhz, dualLayer, shape, outerDiameter: circleOuterDiameter })
        : Math.min(Math.max(requestedTurns || MIN_TURNS, MIN_TURNS), nMax);
      turns = Number(Math.min(nMax, Math.max(MIN_TURNS, Math.round(turns / TURN_RESOLUTION) * TURN_RESOLUTION)).toFixed(2));

      const { Wc, Hc } = copperOuterSize(W, H, BOARD_EDGE_INSET);

      if (shape === 'circle') {
        // ---- 圆形螺旋 ----
        const cx = W / 2, cy = H / 2;
        const boardDiameter = circleDia;
        const actualDiameter = circleOuterDiameter;
        const outerR = actualDiameter / 2;
        const outerTraceR = outerR - w / 2;
        const innerR = Math.max(outerR - w - Math.max(turns - 1, 0) * pitch, 0.005);

        if (!startPos.userSet) {
          startPos.x = cx;
          startPos.y = cy - outerTraceR;
        }

        const built = buildCircleSpiral({
          W, H, w, gap, turns, dir,
          startX: startPos.x,
          startY: startPos.y,
          padMm, gridMm,
          dualLayer: false,
          outerDiameter: actualDiameter,
        });

        let pts;
        let runs;
        let transitionVias;
        let startLayer = 'TopLayer';
        let endLayer = 'TopLayer';
        if (dualLayer) {
          // 顶层内→外、底层外→内；两层圆弧角向相同，在外侧开口过孔串联。
          const gapAngle = Math.atan2(startPos.y - cy, startPos.x - cx);
          const tangent = [-Math.sin(gapAngle), Math.cos(gapAngle)];
          const terminalStep = (padMm + gap) / 2;
          const terminalRight = [cx + tangent[0] * terminalStep, cy + tangent[1] * terminalStep];
          const terminalLeft = [cx - tangent[0] * terminalStep, cy - tangent[1] * terminalStep];
          const topBuilt = buildCircleSpiral({
            W, H, w, gap, turns, dir: 'ccw',
            startX: startPos.x, startY: startPos.y,
            padMm, gridMm, dualLayer: false,
            outerDiameter: actualDiameter,
            radialOrder: 'inner-out',
            terminalStart: terminalRight,
            terminalEnd: [cx, cy],
          });
          const bottomBuilt = buildCircleSpiral({
            W, H, w, gap, turns, dir: 'ccw',
            startX: startPos.x, startY: startPos.y,
            padMm, gridMm, dualLayer: false,
            outerInset: bottomInset,
            outerDiameter: Math.max(actualDiameter - pitch, w + gap),
            radialOrder: 'outer-in',
            terminalStart: [cx, cy],
            terminalEnd: terminalLeft,
          });
          const topPts = [...topBuilt.pts];
          const bottomPts = [...bottomBuilt.pts];
          // 不依赖采样点下标取换层位置：小数匝的最后一段可能不是完整圆，
          // 但两层仍应使用各自完整外圈在开口处的真实端点。
          const topOuterEnd = topBuilt.outerArcEnd || topPts.at(-2);
          const bottomOuterStart = bottomBuilt.outerArcStart || bottomPts[1];
          let viaPt = [
            (topOuterEnd[0] + bottomOuterStart[0]) / 2,
            (topOuterEnd[1] + bottomOuterStart[1]) / 2,
          ];
          // 将过孔圆心拉回板内，给焊盘半径和板边间距留足空间。
          const viaDx = viaPt[0] - cx;
          const viaDy = viaPt[1] - cy;
          const viaR = Math.hypot(viaDx, viaDy);
          const maxViaR = Math.max(boardDiameter / 2 - BOARD_EDGE_INSET - Math.max(padMm, w) / 2, 0.01);
          if (viaR > maxViaR) {
            viaPt = [cx + viaDx / viaR * maxViaR, cy + viaDy / viaR * maxViaR];
          }
          topPts[topPts.length - 1] = [...viaPt];
          bottomPts[0] = [...viaPt];

          if (dir === 'cw') {
            const bottomReverse = [...bottomPts].reverse();
            const topReverse = [...topPts].reverse();
            runs = [
              { layer: 'BottomLayer', pts: bottomReverse },
              { layer: 'TopLayer', pts: topReverse },
            ];
            pts = [...bottomReverse, ...topReverse.slice(1)];
            startLayer = 'BottomLayer';
            endLayer = 'TopLayer';
          } else {
            runs = [
              { layer: 'TopLayer', pts: topPts },
              { layer: 'BottomLayer', pts: bottomPts },
            ];
            pts = [...topPts, ...bottomPts.slice(1)];
            startLayer = 'TopLayer';
            endLayer = 'BottomLayer';
          }
          transitionVias = [viaPt];
        } else {
          pts = [...built.pts];
          runs = [{ layer: 'TopLayer', pts }];
          transitionVias = [];
        }

        startPos.x = built.routeStart[0];
        startPos.y = built.routeStart[1];

        const effectiveTurns = dualLayer ? turns * 2 : turns;
        const innerREff = dualLayer ? innerR - pitch / 2 : innerR;
        const Dout = outerR * 2;
        const Din = Math.max(innerREff * 2, 0.01);
        const Lgeo = inductanceCircle_nH(effectiveTurns, Dout, Din);
        const len = pathLength(pts);
        const Rdc = estimateRdc(len, w, oz);
        const actualFreqMhz = resonantFrequencyMHz(Lgeo, capPf);
        const recommendedCapPf = capacitanceForResonancePf(Lgeo, freqMhz);
        const inductanceDelta = (Lgeo - Ltarget) / Ltarget;
        const inductanceErr = Math.abs(inductanceDelta);
        const err = Math.abs(actualFreqMhz - freqMhz) / freqMhz;
        const autoLimit = maxDensity && Math.abs(turns - nMax) < TURN_RESOLUTION / 2 && Lgeo < Ltarget * (1 - 1e-9)
          ? 'max'
          : (maxDensity && Math.abs(turns - MIN_TURNS) < TURN_RESOLUTION / 2 && Lgeo > Ltarget * (1 + 1e-9) ? 'min' : null);
        const Q = 2 * Math.PI * freqMhz * 1e6 * (Lgeo * 1e-9) / Math.max(Rdc, 1e-9);
        const margin = Math.max(W, H) * 0.08;

        const circleStartSide = dualLayer ? 'inner' : (dir === 'cw' ? 'outer' : 'inner');
        const circleEndSide = dualLayer ? 'inner' : (dir === 'cw' ? 'inner' : 'outer');
        last = {
          pts, runs, transitionVias, dualLayer, startSide: circleStartSide, endSide: circleEndSide, startLayer, endLayer,
          effectiveTurns, W, H, w, gap, turns, chamfer, dir,
          startX: pts[0][0], startY: pts[0][1],
          endX: pts.at(-1)[0], endY: pts.at(-1)[1],
          outerX: startPos.x, outerY: startPos.y,
          routeStartX: built.routeStart[0], routeStartY: built.routeStart[1],
          padMm, Lgeo, Ltarget, actualFreqMhz, recommendedCapPf, inductanceDelta, inductanceErr, len, Rdc, Q, err, autoLimit, nMax, capPf, freqMhz, pitch, margin,
          Wc, Hc, boardDiameter, innerW: innerREff * 2, innerH: innerREff * 2, gridMm,
          shape: 'circle', cx, cy, outerR, outerTraceR, innerR: innerREff,
          fixedTurnsLimited, requestedTurns
        };
        if (!verifyBoardClearance(last)) {
          failCalculation(`圆形线圈生成后检测到板边净距仅 ${last.boardClearanceMeasured.toFixed(3)} mm，已停止输出；请调整参数。`, "板边净距校验失败");
          return;
        }
        dragPreview = null;
        drawSvg(last);
        renderResult(last);
        setExportEnabled(true);
        applyRangeNotice(last);
        $("status").textContent = `${maxDensity ? '自动' : '固定'} N=${formatTurns(turns)}${dualLayer ? `×2=${formatTurns(effectiveTurns)}` : ""}/${nMax} · 板框 ⌀${boardDiameter.toFixed(1)} mm · 铜皮 ⌀${actualDiameter.toFixed(1)} mm · L≈${Lgeo.toFixed(0)} nH${autoLimit === 'max' ? ' · 已达可铺上限' : autoLimit === 'min' ? ' · 已达最小匝数' : ''}`;
        $("circleDiaHint").textContent = `板框 ⌀${boardDiameter.toFixed(2)} mm，可用铜皮外径 ⌀${actualDiameter.toFixed(2)} mm（四周保留 0.30 mm）`;
        saveSettings();
        return;
      }

      // ---- 矩形螺旋 ----
      if (!startPos.userSet) {
        const d0 = defaultOuterBL(w, padMm, gridMm);
        startPos.x = d0.x;
        startPos.y = d0.y;
      }

      const oppositeDir = dir === "cw" ? "ccw" : "cw";
      const topBuildDir = dualLayer && startSide === "inner" ? oppositeDir : dir;
      const bottomBuildDir = topBuildDir === "cw" ? "ccw" : "cw";
      const sharedOuterSeed = dualLayer && startSide === "inner" && layerViaPos.userSet ? layerViaPos : startPos;
      const buildRectPair = (candidateTurns) => {
        // 双端内侧的外侧孔是真正的层间公共节点，必须先落在两层开口约束
        // 的交集内；绝不能让顶/底层各自夹紧后再强行合并端点。
        const commonOuterVia = dualLayer && startSide === "inner"
          ? projectRectCommonOpeningVia({
              W, H, w, gap, turns: candidateTurns, chamfer,
              topDir: topBuildDir, bottomDir: bottomBuildDir,
              padMm, gridMm, bottomInset,
              x: sharedOuterSeed.x, y: sharedOuterSeed.y,
              lockRequestedSide: layerViaPos.userSet,
            })
          : null;
        if (dualLayer && startSide === "inner" && !commonOuterVia) {
          const invalid = {
            invalid: "当前匝数没有可供顶/底层共用的外侧换层位置，请减少匝数或增大板框。",
            pts: [], runs: [], transitionVias: [], snap: sharedOuterSeed,
            routeStart: { x: sharedOuterSeed.x, y: sharedOuterSeed.y },
          };
          return { built: invalid, bottomBuilt: invalid, commonOuterVia: null };
        }
        const pairSeed = commonOuterVia || sharedOuterSeed;
        const top = buildRectSpiralMaxArea({
          W, H, w, gap, turns: candidateTurns, chamfer,
          dir: topBuildDir,
          startX: pairSeed.x,
          startY: pairSeed.y,
          padMm,
          gridMm,
          dualLayer: false,
        });
        const plannedOuterEnd = dualLayer && startSide === "outer" && !top.invalid
          ? adjacentOuterPad({ x: top.pts[0][0], y: top.pts[0][1] }, W, H, w, gap, padMm, gridMm)
          : null;
        const bottom = dualLayer ? buildRectSpiralMaxArea({
          W, H, w, gap, outerInset: bottomInset, turns: candidateTurns, chamfer, dir: bottomBuildDir,
          startX: plannedOuterEnd ? plannedOuterEnd.x : (startSide === "inner" ? top.snap.x : startPos.x),
          startY: plannedOuterEnd ? plannedOuterEnd.y : (startSide === "inner" ? top.snap.y : startPos.y),
          padMm,
          gridMm,
          dualLayer: false,
        }) : null;
        // 理论上两层都应保持 commonOuterVia。留一道数值防线，避免未来修改
        // 半径公式后又悄悄产生两个不同 snap 并重现交叉。
        if (commonOuterVia && (!top.invalid && !bottom?.invalid)) {
          const topDrift = Math.hypot(top.snap.x - commonOuterVia.x, top.snap.y - commonOuterVia.y);
          const bottomDrift = Math.hypot(bottom.snap.x - commonOuterVia.x, bottom.snap.y - commonOuterVia.y);
          if (topDrift > 1e-6 || bottomDrift > 1e-6) {
            const invalid = "顶/底层共同开口位置数值不一致，请移动换层孔或减少匝数。";
            if (topDrift > 1e-6) top.invalid = invalid;
            if (bottomDrift > 1e-6) bottom.invalid = invalid;
          }
        }
        return { built: top, bottomBuilt: bottom, commonOuterVia };
      };

      let { built, bottomBuilt, commonOuterVia } = buildRectPair(turns);
      let geometryAdjustedFrom = null;
      if (maxDensity && (built.invalid || bottomBuilt?.invalid)) {
        // 某些极限内孔能容纳完整匝的开口端，却放不下小数末圈的内侧焊盘。
        // 按频差排序后逐个验证实际几何，选择全范围内误差最小的可制造解。
        const frequencyError = (n) => {
          const hole = innerHoleSize(Wc, Hc, n, w, gap, false);
          const inductance = inductanceRect_nH(dualLayer ? n * 2 : n, Wc, Hc, hole.innerW, hole.innerH);
          return Math.abs(resonantFrequencyMHz(inductance, capPf) - freqMhz);
        };
        const candidates = [];
        const firstUnit = Math.ceil(MIN_TURNS / TURN_RESOLUTION - 1e-9);
        const lastUnit = Math.floor(nMax / TURN_RESOLUTION + 1e-9);
        for (let unit = firstUnit; unit <= lastUnit; unit++) {
          const n = Number((unit * TURN_RESOLUTION).toFixed(2));
          candidates.push({ n, error: frequencyError(n) });
        }
        candidates.sort((a, b) => a.error - b.error || a.n - b.n);
        let chosen = null;
        for (const candidate of candidates) {
          if (Math.abs(candidate.n - turns) < TURN_RESOLUTION / 2) continue;
          const pair = buildRectPair(candidate.n);
          if (!pair.built.invalid && !pair.bottomBuilt?.invalid) {
            chosen = { n: candidate.n, pair };
            break;
          }
        }
        if (chosen) {
          geometryAdjustedFrom = turns;
          turns = chosen.n;
          built = chosen.pair.built;
          bottomBuilt = chosen.pair.bottomBuilt;
          commonOuterVia = chosen.pair.commonOuterVia;
        }
      }
      if (built.invalid || bottomBuilt?.invalid) {
        const message = built.invalid || bottomBuilt.invalid;
        failCalculation(message, "矩形共同开口不可实现");
        return;
      }
      const { innerW: innerWModel, innerH: innerHModel } = innerHoleSize(Wc, Hc, turns, w, gap, false);
      const { innerW, innerH } = innerHoleSize(Wc, Hc, Math.ceil(turns - 1e-9), w, gap, false);
      const topOuterToInner = [...built.pts];
      let topInnerToOuter = [...built.pts].reverse();
      if (startSide === "inner") {
        if (!innerStartPos.userSet) {
          innerStartPos.x = topInnerToOuter[0][0];
          innerStartPos.y = topInnerToOuter[0][1];
        }
        const innerPad = projectInnerPad(
          innerStartPos.x, innerStartPos.y, innerW, innerH, W, H, padMm, gridMm
        );
        innerStartPos.x = innerPad.x;
        innerStartPos.y = innerPad.y;
        topInnerToOuter = trimStartToPad(topInnerToOuter, innerPad);
      }
      let pts, runs, transitionVias, startLayer = "TopLayer", endLayer = "TopLayer";
      if (dualLayer) {
        endLayer = "BottomLayer";
        if (startSide === "outer") {
          const bottomInnerToOuter = [...bottomBuilt.pts].reverse();
          const defaultVia = {
            x: (topOuterToInner.at(-1)[0] + bottomInnerToOuter[0][0]) / 2,
            y: (topOuterToInner.at(-1)[1] + bottomInnerToOuter[0][1]) / 2,
          };
          const innerVia = projectInnerTransitionVia(
            layerViaPos.userSet ? layerViaPos.x : defaultVia.x,
            layerViaPos.userSet ? layerViaPos.y : defaultVia.y,
            Math.max(innerW - pitch, 0), Math.max(innerH - pitch, 0), W, H, padMm, gap, gridMm
          );
          if (!innerVia) {
            failCalculation("内孔不足以放置换层过孔，请减少匝数或减小焊盘/间距。", "换层过孔空间不足");
            return;
          }
          const via = [innerVia.x, innerVia.y];
          const safeInnerW = Math.max(innerW - pitch, 0);
          const safeInnerH = Math.max(innerH - pitch, 0);
          const topLead = routeInsideInnerHole(topOuterToInner.at(-1), via, safeInnerW, safeInnerH, W, H);
          const bottomLead = routeInsideInnerHole(bottomInnerToOuter[0], via, safeInnerW, safeInnerH, W, H);
          const topRun = [...topOuterToInner, ...topLead.slice(1)];
          const bottomRun = [...bottomLead].reverse().concat(bottomInnerToOuter.slice(1));
          pts = [...topRun, ...bottomRun.slice(1)];
          runs = [
            { layer: "TopLayer", pts: topRun },
            { layer: "BottomLayer", pts: bottomRun },
          ];
          transitionVias = [via];
          layerViaPos = { x: innerVia.x, y: innerVia.y, userSet: layerViaPos.userSet };
        } else {
          const bottomOuterToInner = [...bottomBuilt.pts];
          const outerVia = commonOuterVia || projectViaCenter(
              (topInnerToOuter.at(-1)[0] + bottomOuterToInner[0][0]) / 2,
              (topInnerToOuter.at(-1)[1] + bottomOuterToInner[0][1]) / 2,
              W, H, w, padMm, gridMm
            );
          const via = [outerVia.x, outerVia.y];
          const adjacent = adjacentInnerPad(
            { x: topInnerToOuter[0][0], y: topInnerToOuter[0][1] },
            innerW, innerH, W, H, padMm, gap, gridMm
          );
          const topRun = [...topInnerToOuter];
          topRun[topRun.length - 1] = via;
          const bottomFromVia = [...bottomOuterToInner];
          bottomFromVia[0] = via;
          const bottomRun = trimEndToPad(bottomFromVia, adjacent);
          pts = [...topRun, ...bottomRun.slice(1)];
          runs = [
            { layer: "TopLayer", pts: topRun },
            { layer: "BottomLayer", pts: bottomRun },
          ];
          transitionVias = [via];
          layerViaPos = { x: outerVia.x, y: outerVia.y, userSet: layerViaPos.userSet };
        }
      } else {
        const reversePath = startSide === "inner";
        pts = reversePath ? topInnerToOuter : topOuterToInner;
        runs = [{ layer: "TopLayer", pts }];
        transitionVias = [];
      }
      startPos.x = built.snap.x;
      startPos.y = built.snap.y;

      const effectiveTurns = dualLayer ? turns * 2 : turns;
      const Lgeo = inductanceRect_nH(effectiveTurns, Wc, Hc, innerWModel, innerHModel);
      const len = pathLength(pts);
      const Rdc = estimateRdc(len, w, oz);
      const actualFreqMhz = resonantFrequencyMHz(Lgeo, capPf);
      const recommendedCapPf = capacitanceForResonancePf(Lgeo, freqMhz);
      const inductanceDelta = (Lgeo - Ltarget) / Ltarget;
      const inductanceErr = Math.abs(inductanceDelta);
      const err = Math.abs(actualFreqMhz - freqMhz) / freqMhz;
      const autoLimit = geometryAdjustedFrom !== null
        ? 'geometry'
        : (maxDensity && Math.abs(turns - nMax) < TURN_RESOLUTION / 2 && Lgeo < Ltarget * (1 - 1e-9)
          ? 'max'
          : (maxDensity && Math.abs(turns - MIN_TURNS) < TURN_RESOLUTION / 2 && Lgeo > Ltarget * (1 + 1e-9) ? 'min' : null));
      const Q = 2 * Math.PI * freqMhz * 1e6 * (Lgeo * 1e-9) / Math.max(Rdc, 1e-9);
      const margin = Math.max(W, H) * 0.08;

      last = {
        pts, runs, transitionVias, dualLayer, startSide, endSide, startLayer, endLayer, effectiveTurns, W, H, w, gap, turns, chamfer, dir,
        startX: pts[0][0], startY: pts[0][1],
        endX: pts.at(-1)[0], endY: pts.at(-1)[1],
        outerX: startPos.x, outerY: startPos.y,
        routeStartX: built.routeStart.x, routeStartY: built.routeStart.y,
        padMm, Lgeo, Ltarget, actualFreqMhz, recommendedCapPf, inductanceDelta, inductanceErr, len, Rdc, Q, err, autoLimit, nMax, capPf, freqMhz, pitch, margin,
        Wc, Hc, innerW, innerH, gridMm, shape: 'rect', geometryAdjustedFrom,
        viaAdjustedDistance: commonOuterVia?.distance || 0,
        fixedTurnsLimited, requestedTurns
      };
      if (!verifyBoardClearance(last)) {
        failCalculation(`矩形线圈生成后检测到板边净距仅 ${last.boardClearanceMeasured.toFixed(3)} mm，已停止输出；请调整参数。`, "板边净距校验失败");
        return;
      }
      dragPreview = null;
      drawSvg(last);
      renderResult(last);
      setExportEnabled(true);
      applyRangeNotice(last);
      $("status").textContent = `${maxDensity ? '自动' : '固定'} N=${formatTurns(turns)}${dualLayer ? `×2=${formatTurns(effectiveTurns)}` : ""}/${nMax} · ${W}×${H} mm · L≈${Lgeo.toFixed(0)} nH${autoLimit === 'geometry' ? ' · 已按端子净距取可布最优值' : ''}${commonOuterVia?.distance > 1e-6 ? ' · 换层孔已吸附到共同可行位置' : ''}`;
      saveSettings();
    }

    function renderResult(d) {
      const cls = d.err < 0.08 ? "ok" : d.err < 0.2 ? "warn" : "bad";
      const inductanceDelta = Number.isFinite(d.inductanceDelta)
        ? d.inductanceDelta
        : (d.Lgeo - d.Ltarget) / d.Ltarget;
      const inductanceDeltaText = `${inductanceDelta >= 0 ? '+' : ''}${(inductanceDelta * 100).toFixed(1)}%`;
      const shapeInfo = d.shape === 'circle'
        ? `铜皮外径约 ${(d.outerR * 2).toFixed(2)} mm　模型等效内径约 ${(d.innerR * 2).toFixed(2)} mm`
        : `铜皮外边缘约 ${d.Wc.toFixed(2)}×${d.Hc.toFixed(2)} mm　内孔约 ${d.innerW.toFixed(2)}×${d.innerH.toFixed(2)} mm`;
      const dualInfo = d.shape === 'circle'
        ? (d.dualLayer ? "双层外侧过孔串联（两个自由端在圆心）" : "单层顶层（内端在圆心，外端在线圈外侧）")
        : (d.dualLayer ? `双层交错串联（底面观察同向；红=顶层，蓝=底层）${d.startSide === "outer" ? "　内侧" : "　外侧"}过孔换层` : `单层顶层　${d.startSide === "outer" ? "外进内出" : "内进外出"}`);
      const startPlace = d.shape === 'circle' ? (d.startSide === 'outer' ? '外侧' : '圆心') : (d.startSide === 'outer' ? '外侧' : '内侧');
      const endPlace = d.shape === 'circle' ? (d.endSide === 'outer' ? '外侧' : '圆心') : (d.endSide === 'outer' ? '外侧' : '内侧');
      $("result").innerHTML = [
        `目标 L（总等效 C=${d.capPf} pF @ ${d.freqMhz} MHz）：<b>${d.Ltarget.toFixed(1)} nH</b>`,
        `几何估算 L：${d.Lgeo.toFixed(1)} nH（相对目标 ${inductanceDeltaText}；正值偏大，负值偏小）`,
        `反算谐振频率：<span class="${cls}">${d.actualFreqMhz.toFixed(3)} MHz</span>（频率偏差 ${(d.err * 100).toFixed(1)}%）`,
        `当前线圈匹配 ${d.freqMhz} MHz 的推荐总等效 C：<b>${d.recommendedCapPf.toFixed(1)} pF</b>`,
        `每层匝数：${formatTurns(d.turns)}（最大可铺 ${d.nMax}）${d.dualLayer ? `　串联有效匝数 ${formatTurns(d.effectiveTurns)}` : ""}　线宽 ${d.w} mm　最小间距 ${d.gap} mm`,
        d.fixedTurnsLimited ? `<span class="bad">请求 ${formatTurns(d.requestedTurns)} 匝超出可绕制范围，已限为 ${formatTurns(d.turns)} 匝。</span>` :
        d.autoLimit === 'max' ? '<span class="bad">目标电感超过当前板框可实现范围，匝数已卡在最大值；继续调整 C/f 时几何可能保持不变。</span>' :
          (d.autoLimit === 'min' ? '<span class="warn">目标电感低于一匝线圈，匝数已卡在最小值 1.00。</span>' :
            (d.autoLimit === 'geometry'
              ? `<span class="warn">连续解 ${formatTurns(d.geometryAdjustedFrom)} 匝在当前端子/换层孔位置净距不足，已自动采用全范围内频差最小的可布值 ${formatTurns(d.turns)} 匝。</span>`
              : '<span class="muted">匝数按 0.01 匝连续匹配；非整数部分会作为最内侧一匝的实际局部走线绘制和导出。</span>')),
        d.viaAdjustedDistance > 1e-6
          ? `<span class="warn">请求的换层孔位置没有顶/底层共同开口，已沿同一条边吸附到最近可行点（移动 ${d.viaAdjustedDistance.toFixed(3)} mm），避免圆弧被斜线强拉后穿线。</span>`
          : '',
        `绘制方式：<b>${dualInfo}</b>`,
        `${d.shape === 'circle' ? `圆形板框 ⌀${d.boardDiameter.toFixed(2)} mm` : `矩形板框 ${d.W}×${d.H} mm`}　${shapeInfo}`,
        `<span class="ok">板边最小实测净距 ${d.boardClearanceMeasured.toFixed(3)} mm（要求 ≥ 0.300 mm）</span>`,
        `线长≈${d.len.toFixed(1)} mm　Rdc≈${d.Rdc.toFixed(3)} Ω　Q≈${d.Q.toFixed(1)}`,
        `起始端（${d.startLayer} / ${startPlace}）：<b>(${d.startX.toFixed(3)}, ${d.startY.toFixed(3)})</b> mm`,
        `结束端（${d.endLayer} / ${endPlace}）：<b>(${d.endX.toFixed(3)}, ${d.endY.toFixed(3)})</b> mm`,
      ].filter(Boolean).join("<br>");
    }

    function drawSvg(d) {
      const svg = $("coilSvg");
      const m = d.margin;
      const vbW = d.W + 2 * m;
      const vbH = d.H + 2 * m;
      const sx = (x) => x + m;
      const sy = (y) => (d.H - y) + m;
      const isCircle = d.shape === 'circle';

      const layerPaths = d.runs.map((run) => {
        const pathD = run.pts.map((p, i) => `${i ? "L" : "M"}${sx(p[0]).toFixed(3)} ${sy(p[1]).toFixed(3)}`).join(" ");
        const color = run.layer === "TopLayer" ? "#e24c4a" : "#3185fc";
        return `<path data-layer="${run.layer === 'TopLayer' ? '顶层' : '底层'}" d="${pathD}" fill="none" stroke="${color}" stroke-width="${d.w}"
              stroke-linecap="butt" stroke-linejoin="miter" opacity="${dragging ? 0.45 : 1}"/>`;
      }).join("");
      const transitionVias = d.transitionVias.map((p, index) => {
        const preview = dragging && dragTarget === "layerVia" && index === 0 && dragPreview
          ? [dragPreview.x, dragPreview.y] : p;
        const draggable = d.shape === "rect" && d.dualLayer && index === 0;
        return draggable
          ? `<g class="drag-handle" data-drag-kind="layerVia" data-index="${index}">
               <circle data-preview-only="true" cx="${sx(preview[0])}" cy="${sy(preview[1])}" r="${Math.max(d.padMm / 2, d.w * 1.5)}" fill="transparent"/>
               <circle data-role="layer-via" data-layer="多层" cx="${sx(preview[0])}" cy="${sy(preview[1])}" r="${d.padMm / 2}" fill="#b66cff" stroke="#ead8ff" stroke-width="${Math.max(d.padMm * 0.08, 0.04)}"/>
             </g>`
          : `<circle data-role="layer-via" data-layer="多层" cx="${sx(p[0])}" cy="${sy(p[1])}" r="${d.padMm / 2}" fill="#b66cff"/>`;
      }).join("");
      const pStart = d.pts[0];
      const pEnd = d.pts[d.pts.length - 1];
      const terminalPreview = dragging && dragTarget === "terminal" ? dragPreview : null;
      const hx = terminalPreview ? terminalPreview.x : (isCircle ? d.outerX : (d.startSide === "inner" ? d.startX : d.outerX));
      const hy = terminalPreview ? terminalPreview.y : (isCircle ? d.outerY : (d.startSide === "inner" ? d.startY : d.outerY));
      const handleR = d.padMm / 2;
      const hitR = Math.max(handleR, d.w * 1.2);

      // Circle outline for circle shape
      const circleOutline = isCircle
        ? `<circle data-preview-only="true" cx="${sx(d.cx)}" cy="${sy(d.cy)}" r="${d.outerR}" fill="none" stroke="#5a8a6a" stroke-width="${Math.max(d.w * 0.08, 0.04)}" stroke-dasharray="3 3"/>`
        : '';

      const labelText = isCircle
        ? `${d.dualLayer ? "双层" : "单层"}圆形  ⌀${(d.outerR * 2).toFixed(1)}mm  N=${formatTurns(d.turns)}${d.dualLayer ? "×2" : ""}  L≈${d.Lgeo.toFixed(0)}nH`
        : (d.dualLayer ? (d.startSide === "outer" ? "双端外侧" : "双端内侧") : (d.startSide === "outer" ? "外进内出" : "内进外出")) + `  ${d.W}×${d.H}mm  N=${formatTurns(d.turns)}${d.dualLayer ? "×2" : ""}  L≈${d.Lgeo.toFixed(0)}nH`;

      svg.setAttribute("viewBox", `0 0 ${vbW} ${vbH}`);
      svg.style.aspectRatio = `${vbW} / ${vbH}`;
      const stageEl = svg.closest(".stage");
      if (stageEl) stageEl.style.aspectRatio = `${vbW} / ${vbH}`;
      baseViewBox = { x: 0, y: 0, w: vbW, h: vbH };
      cameraViewBox = { ...baseViewBox };
      applyView();
      svg.innerHTML = `
        <defs data-preview-only="true">
          <pattern id="mmGrid" x="${sx(0)}" y="${sy(d.H)}" width="1" height="1" patternUnits="userSpaceOnUse">
            <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#23303d" stroke-width="0.025"/>
          </pattern>
        </defs>
        <rect data-preview-only="true" x="0" y="0" width="${vbW}" height="${vbH}" fill="#0b0f14"/>
        <rect data-preview-only="true" x="${sx(0)}" y="${sy(d.H)}" width="${d.W}" height="${d.H}" fill="url(#mmGrid)"/>
        ${isCircle
          ? `<circle data-layer="板框层" cx="${sx(d.cx)}" cy="${sy(d.cy)}" r="${(d.boardDiameter / 2).toFixed(4)}" fill="none" stroke="#7b5ea7" stroke-width="${Math.max(d.w * 0.12, 0.04)}"/>`
          : `<rect data-layer="板框层" x="${sx(0)}" y="${sy(d.H)}" width="${d.W}" height="${d.H}" fill="none" stroke="#7b5ea7" stroke-width="${Math.max(d.w * 0.12, 0.04)}"/>`}
        ${circleOutline}
        ${layerPaths}
        ${transitionVias}
        <circle data-layer="${d.startLayer === 'TopLayer' ? '顶层' : '底层'}" cx="${sx(pStart[0])}" cy="${sy(pStart[1])}" r="${d.padMm / 2}" fill="#f0a202"/>
        <circle data-layer="${d.endLayer === 'TopLayer' ? '顶层' : '底层'}" cx="${sx(pEnd[0])}" cy="${sy(pEnd[1])}" r="${d.padMm / 2}" fill="#2bb0a6"/>
        <g id="startHandle" class="drag-handle" data-drag-kind="terminal">
          <circle cx="${sx(hx)}" cy="${sy(hy)}" r="${hitR}" fill="transparent"/>
          <circle cx="${sx(hx)}" cy="${sy(hy)}" r="${handleR}" fill="#f0a202" stroke="#ffe6a8" stroke-width="${Math.max(handleR * 0.16, 0.04)}"/>
          <circle cx="${sx(hx)}" cy="${sy(hy)}" r="${handleR * 0.28}" fill="#1a1400"/>
        </g>
        <text x="${sx(0.3)}" y="${sy(-m * 0.35)}" fill="#8fa0b3"
              font-size="${Math.max(Math.min(d.W, d.H) * 0.045, 0.7)}" font-family="Consolas, monospace">
          ${labelText}
        </text>
      `;
    }

    function clientToMm(clientX, clientY) {
      const svg = $("coilSvg");
      const pt = svg.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      const ctm = svg.getScreenCTM();
      if (!ctm || !last) return null;
      const sp = pt.matrixTransform(ctm.inverse());
      const m = last.margin;
      const raw = {
        x: Math.min(Math.max(sp.x - m, 0), last.W),
        y: Math.min(Math.max(last.H - (sp.y - m), 0), last.H),
      };
      if (dragTarget === "layerVia" && last.shape === "rect" && last.dualLayer) {
        if (last.startSide === "outer") {
          return projectInnerTransitionVia(
            raw.x, raw.y,
            Math.max(last.innerW - last.pitch, 0), Math.max(last.innerH - last.pitch, 0),
            last.W, last.H, last.padMm, last.gap, last.gridMm
          );
        }
        return projectViaCenter(raw.x, raw.y, last.W, last.H, last.w, last.padMm, last.gridMm);
      }
      if (last.shape === 'circle') {
        return projectOuterCircle(raw.x, raw.y, last.cx, last.cy, last.outerTraceR, last.padMm, last.gridMm);
      }
      if (last.startSide === "inner") {
        return projectInnerPad(raw.x, raw.y, last.innerW, last.innerH, last.W, last.H, last.padMm, last.gridMm);
      }
      return projectViaCenter(raw.x, raw.y, last.W, last.H, last.w, last.padMm, last.gridMm);
    }

    function projectOuterCircle(x, y, cx, cy, r, padMm, gridMm) {
      const angle = Math.atan2(y - cy, x - cx);
      let sx = cx + r * Math.cos(angle);
      let sy = cy + r * Math.sin(angle);
      if (gridMm > 0) {
        sx = Math.round(sx / gridMm) * gridMm;
        sy = Math.round(sy / gridMm) * gridMm;
      }
      return { x: sx, y: sy };
    }

    function moveHandleOnly(x, y) {
      if (!last) return;
      dragPreview = { x, y };
      const svg = $("coilSvg");
      const m = last.margin;
      const sx = x + m;
      const sy = (last.H - y) + m;
      const g = dragTarget === "layerVia"
        ? svg.querySelector('[data-drag-kind="layerVia"][data-index="0"]')
        : svg.querySelector("#startHandle");
      if (!g) return;
      g.querySelectorAll("circle").forEach((c, i) => {
        c.setAttribute("cx", sx);
        c.setAttribute("cy", sy);
      });
      const label = dragTarget === "layerVia" ? "换层过孔" : (last.startSide === "inner" ? "内侧起始焊盘" : "外侧端点");
      $("scaleInfo").textContent = `拖动${label} (${x.toFixed(3)}, ${y.toFixed(3)}) · 松手后重算`;
    }

    function updateZoomInfo() {
      if (!baseViewBox || !cameraViewBox) {
        $("zoomInfo").textContent = "缩放 100%";
        return;
      }
      const baseAvg = (baseViewBox.w + baseViewBox.h) / 2;
      const camAvg = (cameraViewBox.w + cameraViewBox.h) / 2;
      const pct = baseAvg > 0 ? (baseAvg / camAvg) * 100 : 100;
      $("zoomInfo").textContent = `缩放 ${pct.toFixed(0)}%`;
    }

    function setCameraViewBox(vb) {
      cameraViewBox = { ...vb };
      $("coilSvg").setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
      updateZoomInfo();
    }

    function fitToView() {
      if (!baseViewBox) return;
      setCameraViewBox({ x: baseViewBox.x, y: baseViewBox.y, w: baseViewBox.w, h: baseViewBox.h });
    }

    function zoomAt(clientX, clientY, factor) {
      if (!cameraViewBox || !baseViewBox) return;
      const svg = $("coilSvg");
      const rect = svg.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const px = (clientX - rect.left) / rect.width;
      const py = (clientY - rect.top) / rect.height;
      const cam = cameraViewBox;
      const cx = cam.x + px * cam.w;
      const cy = cam.y + py * cam.h;
      const minW = baseViewBox.w / 20;
      const maxW = baseViewBox.w * 4;
      let newW = cam.w * factor;
      newW = Math.min(Math.max(newW, minW), maxW);
      const newH = cam.h * (newW / cam.w);
      const newX = cx - px * newW;
      const newY = cy - py * newH;
      setCameraViewBox({ x: newX, y: newY, w: newW, h: newH });
    }

    function applyView() {
      const svg = $("coilSvg");
      if (!svg || !cameraViewBox) return;
      svg.setAttribute("viewBox", `${cameraViewBox.x} ${cameraViewBox.y} ${cameraViewBox.w} ${cameraViewBox.h}`);
      const wanted = activeLayerView;
      svg.querySelectorAll("[data-layer]").forEach((el) => {
        const layer = el.getAttribute("data-layer");
        let visible = true;
        if (wanted === "top") visible = layer === "顶层";
        else if (wanted === "bottom") visible = layer === "底层";
        if (visible) el.removeAttribute("display");
        else el.setAttribute("display", "none");
      });
      updateZoomInfo();
    }

    function onWheel(e) {
      if (!last) return;
      e.preventDefault();
      const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
      zoomAt(e.clientX, e.clientY, factor);
    }

    function startPan(e) {
      if (!cameraViewBox || !last) return;
      e.preventDefault();
      panning = true;
      panStartClient = { x: e.clientX, y: e.clientY };
      panStartViewBox = { ...cameraViewBox };
      $("coilSvg").classList.add("panning");
      $("coilSvg").setPointerCapture?.(e.pointerId);
    }

    function panBy(dxPx, dyPx) {
      if (!panning || !panStartClient || !panStartViewBox) return;
      const svg = $("coilSvg");
      const rect = svg.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const vb = panStartViewBox;
      let nx = vb.x - (dxPx / rect.width) * vb.w;
      let ny = vb.y - (dyPx / rect.height) * vb.h;
      // 限制平移范围：相机窗口中心不超出基础视图太多，避免拖丢
      const pad = 0.5;
      const cx0 = baseViewBox.x + baseViewBox.w / 2;
      const cy0 = baseViewBox.y + baseViewBox.h / 2;
      const limitX = baseViewBox.w * (0.5 + pad);
      const limitY = baseViewBox.h * (0.5 + pad);
      const cx = nx + vb.w / 2;
      const cy = ny + vb.h / 2;
      if (Math.abs(cx - cx0) > limitX) nx = cx0 + Math.sign(cx - cx0) * limitX - vb.w / 2;
      if (Math.abs(cy - cy0) > limitY) ny = cy0 + Math.sign(cy - cy0) * limitY - vb.h / 2;
      setCameraViewBox({ x: nx, y: ny, w: vb.w, h: vb.h });
    }

    function endPan(e) {
      if (!panning) return;
      panning = false;
      panStartClient = null;
      panStartViewBox = null;
      $("coilSvg").classList.remove("panning");
      try { $("coilSvg").releasePointerCapture?.(e.pointerId); } catch (_) {}
    }

    function onPointerDown(e) {
      if (!last) return;
      if (e.button === 1) { // 鼠标中键 → 平移
        startPan(e);
        return;
      }
      if (!e.target.closest) return;
      const handle = e.target.closest("[data-drag-kind]");
      if (!handle) return;
      e.preventDefault();
      dragTarget = handle.dataset.dragKind === "layerVia" ? "layerVia" : "terminal";
      dragging = true;
      $("coilSvg").classList.add("dragging");
      $("coilSvg").setPointerCapture?.(e.pointerId);
      // 拖动中让线圈半透明，提示尚未重算
      $("coilSvg").querySelectorAll("path[data-layer]").forEach(path => path.setAttribute("opacity", "0.45"));
      const mm = clientToMm(e.clientX, e.clientY);
      if (mm) moveHandleOnly(mm.x, mm.y);
    }

    function onPointerMove(e) {
      if (panning) {
        e.preventDefault();
        panBy(e.clientX - panStartClient.x, e.clientY - panStartClient.y);
        return;
      }
      if (!dragging || !last) return;
      e.preventDefault();
      const mm = clientToMm(e.clientX, e.clientY);
      if (mm) moveHandleOnly(mm.x, mm.y);
    }

    function onPointerUp(e) {
      if (panning) {
        endPan(e);
        return;
      }
      if (!dragging) return;
      dragging = false;
      $("coilSvg").classList.remove("dragging");
      try { $("coilSvg").releasePointerCapture?.(e.pointerId); } catch (_) {}

      const mm = clientToMm(e.clientX, e.clientY) || dragPreview;
      if (mm && last) {
        if (dragTarget === "layerVia") {
          layerViaPos = { x: mm.x, y: mm.y, userSet: true };
        } else if (last.shape === 'circle') {
          const snap = projectOuterCircle(mm.x, mm.y, last.cx, last.cy, last.outerR, last.padMm, last.gridMm);
          startPos.x = snap.x;
          startPos.y = snap.y;
          startPos.userSet = true;
        } else if (last.startSide === "inner") {
          const snap = projectInnerPad(mm.x, mm.y, last.innerW, last.innerH, last.W, last.H, last.padMm, last.gridMm);
          innerStartPos.x = snap.x;
          innerStartPos.y = snap.y;
          innerStartPos.userSet = true;
        } else {
          const snap = projectViaCenter(mm.x, mm.y, last.W, last.H, last.w, last.padMm, last.gridMm);
          startPos.x = snap.x;
          startPos.y = snap.y;
          startPos.userSet = true;
        }
      }
      dragPreview = null;
      dragTarget = null;
      calcAndDraw(); // 松手后重新计算
    }

    function download(name, text, mime) {
      const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function exportSvg() {
      if (!last) calcAndDraw();
      const clone = $("coilSvg").cloneNode(true);
      clone.querySelectorAll('[data-preview-only="true"]').forEach(el => el.remove());
      clone.querySelector("#startHandle")?.remove();
      clone.querySelectorAll("text").forEach(el => el.remove());
      download(`coil_${last.W}x${last.H}_N${formatTurns(last.turns)}.svg`, `<?xml version="1.0" encoding="UTF-8"?>\n${clone.outerHTML}`, "image/svg+xml");
    }

    function exportDxf() {
      if (!last) calcAndDraw();
      const exportLayer = (layer) => layer === "TopLayer" ? "顶层" : layer === "BottomLayer" ? "底层" : "多层";
      const lines = [
        "0", "SECTION", "2", "HEADER",
        "9", "$ACADVER", "1", "AC1015",
        "9", "$INSUNITS", "70", "4",
        "9", "$MEASUREMENT", "70", "1",
        "0", "ENDSEC",
        "0", "SECTION", "2", "ENTITIES",
      ];
      if (last.shape === "circle") {
        lines.push(
          "0", "CIRCLE", "100", "AcDbEntity", "8", "板框层", "100", "AcDbCircle",
          "10", last.cx.toFixed(4), "20", last.cy.toFixed(4), "30", "0",
          "40", (last.boardDiameter / 2).toFixed(4)
        );
      } else {
        lines.push(
          "0", "LWPOLYLINE", "100", "AcDbEntity", "8", "板框层",
          "100", "AcDbPolyline", "90", "4", "70", "1",
          "10", "0", "20", "0",
          "10", last.W.toFixed(4), "20", "0",
          "10", last.W.toFixed(4), "20", last.H.toFixed(4),
          "10", "0", "20", last.H.toFixed(4)
        );
      }
      for (const run of last.runs) {
        lines.push(
          "0", "LWPOLYLINE", "100", "AcDbEntity", "8", exportLayer(run.layer),
          "100", "AcDbPolyline", "90", String(run.pts.length), "70", "0", "43", last.w.toFixed(4)
        );
        for (const p of run.pts) lines.push("10", p[0].toFixed(4), "20", p[1].toFixed(4));
      }
      lines.push(
        "0", "CIRCLE", "100", "AcDbEntity", "8", exportLayer(last.startLayer), "100", "AcDbCircle",
        "10", last.startX.toFixed(4), "20", last.startY.toFixed(4), "30", "0",
        "40", (last.padMm / 2).toFixed(4),
        "0", "CIRCLE", "100", "AcDbEntity", "8", exportLayer(last.endLayer), "100", "AcDbCircle",
        "10", last.pts[last.pts.length - 1][0].toFixed(4), "20", last.pts[last.pts.length - 1][1].toFixed(4), "30", "0",
        "40", (last.padMm / 2).toFixed(4)
      );
      for (const p of last.transitionVias) {
        lines.push(
          "0", "CIRCLE", "100", "AcDbEntity", "8", "多层", "100", "AcDbCircle",
          "10", p[0].toFixed(4), "20", p[1].toFixed(4), "30", "0",
          "40", (last.padMm / 2).toFixed(4)
        );
      }
      lines.push("0", "ENDSEC", "0", "EOF");
      download(`coil_${last.W}x${last.H}_N${formatTurns(last.turns)}.dxf`, lines.join("\n"), "application/dxf");
    }

    function exportEasyeda() {
      if (!last) calcAndDraw();
      const exportLayer = (layer) => layer === "TopLayer" ? "顶层" : layer === "BottomLayer" ? "底层" : "多层";
      const shapeName = last.shape === 'circle' ? 'CircleSpiral' : 'RectSpiral';
      const payload = {
        name: `${shapeName}_${last.W}x${last.H}_N${formatTurns(last.turns)}`,
        unit: "mm",
        origin: "outer_bottom_left",
        allowed_layers: ["板框层", "顶层", "底层", "多层"],
        layers: last.dualLayer ? ["顶层", "底层"] : ["顶层"],
        mode: last.dualLayer ? "dual_layer_series_same_winding" : "single_layer",
        width: last.w,
        min_clearance: last.gap,
        start_grid: last.gridMm,
        turns: last.turns,
        board: last.shape === "circle"
          ? { layer: "板框层", shape: "circle", cx: last.cx, cy: last.cy, diameter: last.boardDiameter }
          : { layer: "板框层", w: last.W, h: last.H },
        copper_outer: { w: last.Wc, h: last.Hc },
        terminal_layout: `${last.startSide}_to_${last.endSide}`,
        start_terminal: { layer: exportLayer(last.startLayer), side: last.startSide, x: last.startX, y: last.startY, diameter: last.padMm },
        end_terminal: { layer: exportLayer(last.endLayer), side: last.endSide, x: last.endX, y: last.endY, diameter: last.padMm },
        outer_terminal: { x: last.outerX, y: last.outerY, diameter: last.padMm },
        route_start: { x: last.routeStartX, y: last.routeStartY },
        format_note: "centerline points with width; use DXF/SVG for direct graphic import",
        inductance_nH_est: Number(last.Lgeo.toFixed(2)),
        target_nH: Number(last.Ltarget.toFixed(2)),
        layer_runs: last.runs.map(run => ({
          layer: exportLayer(run.layer),
          points: run.pts.map(p => [Number(p[0].toFixed(4)), Number(p[1].toFixed(4))]),
        })),
        transition_vias: last.transitionVias.map(p => ({
          layer: "多层", x: Number(p[0].toFixed(4)), y: Number(p[1].toFixed(4)), diameter: last.padMm,
        })),
        points: last.pts.map(p => [Number(p[0].toFixed(4)), Number(p[1].toFixed(4))]),
      };
      download(`coil_easyeda_${last.W}x${last.H}.json`, JSON.stringify(payload, null, 2), "application/json");
    }

    function saveSettings() {
      try {
        const fields = {};
        for (const id of SETTING_FIELDS) {
          const el = $(id);
          fields[id] = el.type === "checkbox" ? el.checked : el.value;
        }
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          fields,
          startPos,
          innerStartPos,
          layerViaPos,
        }));
      } catch (_) {}
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        for (const id of SETTING_FIELDS) {
          if (!saved.fields || !(id in saved.fields)) continue;
          const el = $(id);
          if (el.type === "checkbox") el.checked = !!saved.fields[id];
          else el.value = saved.fields[id];
        }
        if (saved.startPos && Number.isFinite(saved.startPos.x) && Number.isFinite(saved.startPos.y)) {
          startPos = {
            x: saved.startPos.x,
            y: saved.startPos.y,
            userSet: !!saved.startPos.userSet,
          };
        }
        if (saved.innerStartPos && Number.isFinite(saved.innerStartPos.x) && Number.isFinite(saved.innerStartPos.y)) {
          innerStartPos = {
            x: saved.innerStartPos.x,
            y: saved.innerStartPos.y,
            userSet: !!saved.innerStartPos.userSet,
          };
        }
        if (saved.layerViaPos && Number.isFinite(saved.layerViaPos.x) && Number.isFinite(saved.layerViaPos.y)) {
          layerViaPos = {
            x: saved.layerViaPos.x,
            y: saved.layerViaPos.y,
            userSet: !!saved.layerViaPos.userSet,
          };
        }
      } catch (_) {}
    }

    loadSettings();
    function syncShapeControls() {
      const circle = $("shape").value === "circle";
      $("rectBoardRow").style.display = circle ? "none" : "grid";
      $("circleDiaRow").style.display = circle ? "grid" : "none";
      $("chamferMm").disabled = circle;
      $("startSide").disabled = circle;
      $("endSide").disabled = circle;
    }
    syncShapeControls();
    function syncTerminalSides(changed) {
      const sameSide = $("dualLayer").checked;
      if (changed === "endSide") {
        $("startSide").value = sameSide
          ? $("endSide").value
          : ($("endSide").value === "outer" ? "inner" : "outer");
      } else {
        $("endSide").value = sameSide
          ? $("startSide").value
          : ($("startSide").value === "outer" ? "inner" : "outer");
      }
    }
    syncTerminalSides("startSide");
    $("turnsRow").style.display = $("maxDensity").checked ? "none" : "grid";

    $("maxDensity").addEventListener("change", () => {
      $("turnsRow").style.display = $("maxDensity").checked ? "none" : "grid";
      calcAndDraw();
    });
    $("dualLayer").addEventListener("change", () => {
      syncTerminalSides("startSide");
      layerViaPos.userSet = false;
      calcAndDraw();
    });
    $("startSide").addEventListener("change", () => {
      syncTerminalSides("startSide");
      layerViaPos.userSet = false;
      calcAndDraw();
    });
    $("endSide").addEventListener("change", () => {
      syncTerminalSides("endSide");
      layerViaPos.userSet = false;
      calcAndDraw();
    });
    $("shape").addEventListener("change", () => {
      syncShapeControls();
      startPos.userSet = false;
      innerStartPos.userSet = false;
      layerViaPos.userSet = false;
      calcAndDraw();
    });
    $("btnSvg").addEventListener("click", exportSvg);
    $("btnDxf").addEventListener("click", exportDxf);
    $("btnEasy").addEventListener("click", exportEasyeda);

    const svg = $("coilSvg");
    svg.addEventListener("pointerdown", onPointerDown);
    svg.addEventListener("pointermove", onPointerMove);
    svg.addEventListener("pointerup", onPointerUp);
    svg.addEventListener("pointercancel", onPointerUp);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);

    const stage = document.querySelector(".stage");
    if (stage) {
      stage.addEventListener("wheel", onWheel, { passive: false });
    }

    function setActiveLayerView(value, btn) {
      activeLayerView = value;
      ["viewAll", "viewTop", "viewBottom"].forEach((id) => $(id).classList.remove("active"));
      if (btn) btn.classList.add("active");
      applyView();
    }
    $("viewAll").addEventListener("click", (e) => setActiveLayerView("all", e.currentTarget));
    $("viewTop").addEventListener("click", (e) => setActiveLayerView("top", e.currentTarget));
    $("viewBottom").addEventListener("click", (e) => setActiveLayerView("bottom", e.currentTarget));
    $("resetZoom").addEventListener("click", () => { fitToView(); applyView(); });
    updateZoomInfo();

    let drawFrame = null;
    function scheduleDraw() {
      if (drawFrame !== null) cancelAnimationFrame(drawFrame);
      drawFrame = requestAnimationFrame(() => {
        drawFrame = null;
        calcAndDraw();
      });
    }
    ["capPf", "freqMhz", "outerW", "outerH", "circleDia", "widthMm", "gapMm", "chamferMm", "dir", "turnsFixed", "padMm", "gridMm", "copperOz"]
      .forEach((id) => {
        $(id).addEventListener("input", scheduleDraw);
        $(id).addEventListener("change", calcAndDraw);
      });
    SETTING_FIELDS.forEach((id) => $(id).addEventListener("input", saveSettings));

    calcAndDraw();
  </script>
</body>
</html>
